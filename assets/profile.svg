<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#ffffff" fill-opacity="0.03"/>
      <rect x="8" y="8" width="8" height="8" fill="#ffffff" fill-opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="640" fill="#1a0f0c"/>
  <rect width="1000" height="640" fill="url(#grid)"/>

  <!-- Twinkling pixels -->
  <rect x="12" y="12" width="6" height="6" fill="#e8b869">
    <animate attributeName="opacity" values="0;0.9;0" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="976" y="22" width="6" height="6" fill="#8c1d2c">
    <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="14" y="604" width="6" height="6" fill="#8c1d2c">
    <animate attributeName="opacity" values="0;1;0" dur="5s" begin="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="970" y="610" width="6" height="6" fill="#e8b869">
    <animate attributeName="opacity" values="0;0.9;0" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="500" y="10" width="6" height="6" fill="#e8b869">
    <animate attributeName="opacity" values="0;0.7;0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="500" y="626" width="6" height="6" fill="#8c1d2c">
    <animate attributeName="opacity" values="0;1;0" dur="3.8s" begin="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Window shadow and frame -->
  <rect x="50" y="50" width="920" height="540" fill="#0d0605"/>
  <rect x="40" y="40" width="920" height="540" fill="#24150f" stroke="#8c5a3c" stroke-width="4"/>

  <!-- Title bar -->
  <rect x="44" y="44" width="912" height="40" fill="#5c1a24"/>
  <rect x="60" y="56" width="12" height="12" fill="#e8b869"/>
  <rect x="78" y="56" width="12" height="12" fill="#8c5a3c"/>
  <rect x="96" y="56" width="12" height="12" fill="#f2e6d9"/>
  <text x="500" y="70" text-anchor="middle" font-size="15" fill="#f2e6d9">kanishk.profile — README</text>
  <rect x="44" y="84" width="912" height="4" fill="#8c5a3c"/>

  <!-- Line number gutter -->
  <rect x="44" y="88" width="72" height="452" fill="#1f110c"/>
  <rect x="116" y="88" width="3" height="452" fill="#3b241b"/>
  <g font-size="16" fill="#6b4a3e" text-anchor="end">
    <text x="96" y="130">1</text>
    <text x="96" y="160">2</text>
    <text x="96" y="190">3</text>
    <text x="96" y="220">4</text>
    <text x="96" y="250">5</text>
    <text x="96" y="280">6</text>
    <text x="96" y="310">7</text>
    <text x="96" y="340">8</text>
    <text x="96" y="370">9</text>
    <text x="96" y="400">10</text>
    <text x="96" y="430">11</text>
    <text x="96" y="460">12</text>
  </g>

  <!-- Active line highlight -->
  <rect x="119" y="442" width="478" height="28" fill="#ffffff" fill-opacity="0.04"/>

  <!-- Code, typed in line by line -->
  <g font-size="18">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.1s" fill="freeze"/>
      <text x="130" y="130"><tspan fill="#d9725f">const</tspan><tspan fill="#f2e6d9"> kanishk</tspan><tspan fill="#8c6a5a"> = {</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.1s" fill="freeze"/>
      <text x="152" y="160"><tspan fill="#e8c4a0">name</tspan><tspan fill="#8c6a5a">: </tspan><tspan fill="#e8b869">"Kanishk Nandeshwar"</tspan><tspan fill="#8c6a5a">,</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.1s" fill="freeze"/>
      <text x="152" y="190"><tspan fill="#e8c4a0">degree</tspan><tspan fill="#8c6a5a">: </tspan><tspan fill="#e8b869">"B.Tech Data Science &amp; AI"</tspan><tspan fill="#8c6a5a">,</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.1s" fill="freeze"/>
      <text x="152" y="220"><tspan fill="#e8c4a0">institute</tspan><tspan fill="#8c6a5a">: </tspan><tspan fill="#e8b869">"IIT Bhilai"</tspan><tspan fill="#8c6a5a">,</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.1s" fill="freeze"/>
      <text x="152" y="250"><tspan fill="#e8c4a0">focus</tspan><tspan fill="#8c6a5a">: [</tspan><tspan fill="#e8b869">"ML"</tspan><tspan fill="#8c6a5a">, </tspan><tspan fill="#e8b869">"NLP"</tspan><tspan fill="#8c6a5a">, </tspan><tspan fill="#e8b869">"C++"</tspan><tspan fill="#8c6a5a">],</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.1s" fill="freeze"/>
      <text x="152" y="280"><tspan fill="#e8c4a0">building</tspan><tspan fill="#8c6a5a">: </tspan><tspan fill="#e8b869">"LPG Shortage 2026"</tspan><tspan fill="#8c6a5a">,</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.1s" fill="freeze"/>
      <text x="152" y="310"><tspan fill="#e8c4a0">contributing</tspan><tspan fill="#8c6a5a">: [</tspan><tspan fill="#e8b869">"DUET"</tspan><tspan fill="#8c6a5a">, </tspan><tspan fill="#e8b869">"Quoridor"</tspan><tspan fill="#8c6a5a">],</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.1s" fill="freeze"/>
      <text x="152" y="340"><tspan fill="#e8c4a0">linkedin</tspan><tspan fill="#8c6a5a">: </tspan><tspan fill="#e8b869">"kanishk-nandeshwar"</tspan><tspan fill="#8c6a5a">,</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.1s" fill="freeze"/>
      <text x="130" y="370"><tspan fill="#8c6a5a">};</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.1s" fill="freeze"/>
      <text x="130" y="430"><tspan fill="#6b4a3e">// open to internships &amp; collabs</tspan></text>
    </g>
  </g>

  <!-- Blinking cursor on line 12 -->
  <rect x="130" y="442" width="11" height="22" fill="#e8b869">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Status bar -->
  <rect x="44" y="540" width="912" height="36" fill="#5c1a24"/>
  <text x="60" y="563" font-size="13" fill="#f2e6d9">main  ·  UTF-8  ·  Ln 12, Col 1</text>
  <text x="940" y="563" font-size="13" fill="#f2e6d9" text-anchor="end">B.Tech · IIT Bhilai</text>

  <!-- Right panel -->
  <rect x="598" y="88" width="3" height="452" fill="#3b241b"/>
  <rect x="601" y="88" width="351" height="452" fill="#2a1812"/>

  <text x="776" y="140" text-anchor="middle" font-size="13" fill="#8c6a5a" letter-spacing="2">STATUS</text>
  <rect x="640" y="160" width="10" height="10" fill="#e8b869">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="660" y="170" font-size="15" fill="#e8c4a0">open to collaborate</text>

  <!-- Pixel coffee mug -->
  <g>
    <!-- Steam -->
    <rect x="738" y="240" width="12" height="12" fill="#e8b869">
      <animate attributeName="y" values="240;176" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="770" y="240" width="12" height="12" fill="#e8b869">
      <animate attributeName="y" values="240;176" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="802" y="240" width="12" height="12" fill="#e8b869">
      <animate attributeName="y" values="240;176" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </rect>

    <!-- Coffee surface and body -->
    <rect x="706" y="264" width="112" height="16" fill="#6b4226"/>
    <rect x="706" y="280" width="112" height="96" fill="#8c1d2c"/>
    <rect x="714" y="288" width="16" height="80" fill="#b03a48" fill-opacity="0.5"/>
    <rect x="706" y="328" width="112" height="8" fill="#5c1a24"/>
    <rect x="706" y="336" width="112" height="8" fill="#e8b869" fill-opacity="0.6"/>

    <!-- Handle -->
    <rect x="818" y="296" width="16" height="16" fill="#8c1d2c"/>
    <rect x="834" y="312" width="16" height="48" fill="#8c1d2c"/>
    <rect x="818" y="360" width="16" height="16" fill="#8c1d2c"/>

    <!-- Saucer -->
    <rect x="680" y="392" width="164" height="16" fill="#6b4226"/>
    <rect x="696" y="408" width="132" height="8" fill="#5c1a24"/>
  </g>

  <text x="776" y="480" text-anchor="middle" font-size="14" fill="#8c6a5a">&gt; brewing new projects_</text>
</svg>
