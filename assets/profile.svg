<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#d4af6a" fill-opacity="0.08"/>
    </pattern>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af6a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d4af6a" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#d4af6a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="640" fill="#06070a"/>
  <rect width="1000" height="640" fill="url(#dots)"/>

  <!-- Twinkling pixels -->
  <rect x="22" y="22" width="5" height="5" fill="#d4af6a">
    <animate attributeName="opacity" values="0;0.9;0" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="972" y="26" width="5" height="5" fill="#7dd3c0">
    <animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="22" y="612" width="5" height="5" fill="#7dd3c0">
    <animate attributeName="opacity" values="0;0.9;0" dur="5s" begin="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="968" y="606" width="5" height="5" fill="#d4af6a">
    <animate attributeName="opacity" values="0;0.9;0" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="498" y="12" width="5" height="5" fill="#d4af6a">
    <animate attributeName="opacity" values="0;0.7;0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="498" y="624" width="5" height="5" fill="#7dd3c0">
    <animate attributeName="opacity" values="0;0.7;0" dur="3.8s" begin="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Window shadow and frame -->
  <rect x="52" y="56" width="920" height="540" fill="#000000" fill-opacity="0.6"/>
  <rect x="40" y="40" width="920" height="540" fill="#0e1014" stroke="#2a2f38" stroke-width="2"/>

  <!-- Title bar -->
  <rect x="41" y="41" width="918" height="43" fill="#15181e"/>
  <circle cx="62" cy="62" r="5" fill="#d4af6a"/>
  <circle cx="80" cy="62" r="5" fill="#3a404b"/>
  <circle cx="98" cy="62" r="5" fill="#3a404b"/>
  <text x="500" y="68" text-anchor="middle" font-size="14" fill="#8a8f99">kanishk.profile — README</text>
  <rect x="41" y="84" width="918" height="1" fill="#2a2f38"/>

  <!-- Line number gutter -->
  <rect x="41" y="85" width="71" height="455" fill="#0b0c0f"/>
  <rect x="112" y="85" width="1" height="455" fill="#2a2f38"/>
  <g font-size="15" fill="#3a404b" text-anchor="end">
    <text x="96" y="130">1</text>
    <text x="96" y="160">2</text>
    <text x="96" y="190">3</text>
    <text x="96" y="220">4</text>
    <text x="96" y="250">5</text>
    <text x="96" y="280">6</text>
    <text x="96" y="310">7</text>
    <text x="96" y="340">8</text>
    <text x="96" y="370">9</text>
    <text x="96" y="400">10</text>
    <text x="96" y="430">11</text>
    <text x="96" y="460">12</text>
  </g>

  <!-- Active line highlight -->
  <rect x="113" y="440" width="485" height="28" fill="#d4af6a" fill-opacity="0.06"/>

  <!-- Code, typed in line by line -->
  <g font-size="18">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.1s" fill="freeze"/>
      <text x="130" y="130"><tspan fill="#7dd3c0">const</tspan><tspan fill="#eceef2"> kanishk</tspan><tspan fill="#4b5260"> = {</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.1s" fill="freeze"/>
      <text x="152" y="160"><tspan fill="#c9ced8">name</tspan><tspan fill="#4b5260">: </tspan><tspan fill="#d4af6a">"Kanishk Nandeshwar"</tspan><tspan fill="#4b5260">,</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.1s" fill="freeze"/>
      <text x="152" y="190"><tspan fill="#c9ced8">degree</tspan><tspan fill="#4b5260">: </tspan><tspan fill="#d4af6a">"B.Tech Data Science &amp; AI"</tspan><tspan fill="#4b5260">,</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.1s" fill="freeze"/>
      <text x="152" y="220"><tspan fill="#c9ced8">institute</tspan><tspan fill="#4b5260">: </tspan><tspan fill="#d4af6a">"IIT Bhilai"</tspan><tspan fill="#4b5260">,</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.75s" dur="0.1s" fill="freeze"/>
      <text x="152" y="250"><tspan fill="#c9ced8">focus</tspan><tspan fill="#4b5260">: [</tspan><tspan fill="#d4af6a">"ML"</tspan><tspan fill="#4b5260">, </tspan><tspan fill="#d4af6a">"NLP"</tspan><tspan fill="#4b5260">, </tspan><tspan fill="#d4af6a">"C++"</tspan><tspan fill="#4b5260">],</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.1s" fill="freeze"/>
      <text x="152" y="280"><tspan fill="#c9ced8">building</tspan><tspan fill="#4b5260">: </tspan><tspan fill="#d4af6a">"LPG Shortage 2026"</tspan><tspan fill="#4b5260">,</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.45s" dur="0.1s" fill="freeze"/>
      <text x="152" y="310"><tspan fill="#c9ced8">contributing</tspan><tspan fill="#4b5260">: [</tspan><tspan fill="#d4af6a">"DUET"</tspan><tspan fill="#4b5260">, </tspan><tspan fill="#d4af6a">"Quoridor"</tspan><tspan fill="#4b5260">],</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.1s" fill="freeze"/>
      <text x="152" y="340"><tspan fill="#c9ced8">linkedin</tspan><tspan fill="#4b5260">: </tspan><tspan fill="#d4af6a">"kanishk-nandeshwar"</tspan><tspan fill="#4b5260">,</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.15s" dur="0.1s" fill="freeze"/>
      <text x="130" y="370"><tspan fill="#4b5260">};</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.1s" fill="freeze"/>
      <text x="130" y="400"><tspan fill="#4b5260" font-style="italic">// open to internships &amp; collabs</tspan></text>
    </g>
  </g>

  <!-- Blinking cursor on line 12 -->
  <rect x="130" y="440" width="10" height="22" fill="#d4af6a">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Right panel -->
  <rect x="598" y="85" width="2" height="455" fill="#2a2f38"/>
  <rect x="600" y="85" width="360" height="455" fill="#101318"/>

  <text x="780" y="140" text-anchor="middle" font-size="12" fill="#6b7280" letter-spacing="3">STATUS</text>
  <circle cx="640" cy="160" r="5" fill="#d4af6a">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="656" y="165" font-size="15" fill="#eceef2">open to collaborate</text>

  <text x="640" y="215" font-size="12" fill="#6b7280" letter-spacing="3">CURRENTLY</text>
  <text x="640" y="240" font-size="15" fill="#eceef2">▸ LPG Shortage 2026</text>
  <text x="640" y="264" font-size="15" fill="#eceef2">▸ Dodge Game · MediaPipe</text>

  <!-- Pixel coffee mug -->
  <g transform="translate(18 0)">
    <!-- Steam -->
    <rect x="738" y="240" width="12" height="12" fill="#d4af6a">
      <animate attributeName="y" values="240;176" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="770" y="240" width="12" height="12" fill="#d4af6a">
      <animate attributeName="y" values="240;176" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="802" y="240" width="12" height="12" fill="#d4af6a">
      <animate attributeName="y" values="240;176" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </rect>

    <!-- Body -->
    <rect x="706" y="264" width="112" height="16" fill="#8a7548"/>
    <rect x="706" y="280" width="112" height="96" fill="#1b1f27" stroke="#2a2f38" stroke-width="2"/>
    <rect x="714" y="288" width="16" height="80" fill="#d4af6a" fill-opacity="0.12"/>
    <rect x="706" y="328" width="112" height="6" fill="#d4af6a"/>

    <!-- Handle -->
    <rect x="818" y="296" width="16" height="16" fill="#1b1f27" stroke="#2a2f38" stroke-width="2"/>
    <rect x="834" y="312" width="16" height="48" fill="#1b1f27" stroke="#2a2f38" stroke-width="2"/>
    <rect x="818" y="360" width="16" height="16" fill="#1b1f27" stroke="#2a2f38" stroke-width="2"/>

    <!-- Saucer -->
    <rect x="680" y="392" width="164" height="16" fill="#2a2f38"/>
    <rect x="696" y="408" width="132" height="8" fill="#15181e"/>
  </g>

  <text x="780" y="480" text-anchor="middle" font-size="14" fill="#6b7280">&gt; brewing new projects_</text>

  <!-- Status bar -->
  <rect x="41" y="540" width="918" height="39" fill="#15181e"/>
  <rect x="41" y="540" width="918" height="1" fill="#2a2f38"/>
  <text x="60" y="564" font-size="13" fill="#d4af6a">main  ·  UTF-8  ·  Ln 12, Col 1</text>
  <text x="940" y="564" font-size="13" fill="#6b7280" text-anchor="end">B.Tech · IIT Bhilai</text>

  <!-- Gold sheen sweeping across the window -->
  <rect x="-300" y="40" width="300" height="540" fill="url(#sheen)">
    <animate attributeName="x" values="-300;1000" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
