<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#1c1c1e"/>
    </linearGradient>
    <radialGradient id="blobBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#bf5af2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bf5af2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.035"/>
    </linearGradient>
    <linearGradient id="shine" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#8e8e93"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8e8e93"/>
      <animate attributeName="x1" values="-1;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64d2ff"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pills">
      <rect x="60" y="178" width="880" height="44"/>
    </clipPath>
  </defs>

  <rect width="1000" height="800" fill="url(#bg)"/>

  <circle cx="180" cy="120" r="260" fill="url(#blobBlue)">
    <animate attributeName="cx" values="180;320;180" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;220;120" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="620" r="280" fill="url(#blobPurple)">
    <animate attributeName="cx" values="840;700;840" dur="20s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="620;500;620" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- HEADER -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
    <rect x="40" y="30" width="920" height="200" rx="40" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
    <rect x="40" y="30" width="920" height="200" rx="40" fill="none" stroke="#0a84ff" stroke-width="2" pathLength="100" stroke-dasharray="12 88" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="500" y="112" text-anchor="middle" font-size="60" font-weight="700" letter-spacing="-2" fill="url(#shine)">Kanishk Nandeshwar</text>
    <text x="500" y="152" text-anchor="middle" font-size="19" fill="#86868b" letter-spacing="0.3">Data Science &amp; AI · IIT Bhilai</text>
    <g clip-path="url(#pills)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;-784 0" dur="18s" repeatCount="indefinite"/>
        <rect x="100" y="184" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="150" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f7">Python</text>
        <rect x="212" y="184" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="262" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f7">C++</text>
        <rect x="324" y="184" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="374" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f7">C</text>
        <rect x="436" y="184" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="486" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f7">ML</text>
        <rect x="548" y="184" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="598" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f7">NLP</text>
        <rect x="660" y="184" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="710" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f7">PyTorch</text>
        <rect x="772" y="184" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="822" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f7">Git</text>

        <rect x="884" y="184" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="934" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f7">Python</text>
        <rect x="996" y="184" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="1046" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f7">C++</text>
        <rect x="1108" y="184" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="1158" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f7">C</text>
        <rect x="1220" y="184" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="1270" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f7">ML</text>
        <rect x="1332" y="184" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="1382" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f7">NLP</text>
        <rect x="1444" y="184" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="1494" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f7">PyTorch</text>
        <rect x="1556" y="184" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="1606" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f7">Git</text>
      </g>
    </g>
  </g>

  <!-- CARD A: FEATURED PROJECT (left, tall) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 24" to="0 0" begin="0.2s" dur="0.8s" fill="freeze"/>
    <rect x="40" y="260" width="520" height="330" rx="36" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
    <rect x="40" y="260" width="520" height="330" rx="36" fill="none" stroke="#0a84ff" stroke-width="2" pathLength="100" stroke-dasharray="12 88" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="76" y="306" font-size="12" font-weight="600" letter-spacing="2" fill="#0a84ff">FEATURED PROJECT</text>
    <text x="76" y="362" font-size="40" font-weight="700" letter-spacing="-1" fill="#f5f5f7">LPG Shortage 2026</text>
    <text x="76" y="396" font-size="17" fill="#86868b">Major project analysing the 2026 LPG shortage.</text>

    <g transform="translate(0 548)">
      <rect x="316" y="-60" width="20" height="60" rx="6" fill="url(#barGrad)">
        <animateTransform attributeName="transform" type="scale" values="1 0.4;1 1;1 0.4" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(0 548)">
      <rect x="348" y="-100" width="20" height="100" rx="6" fill="url(#barGrad)">
        <animateTransform attributeName="transform" type="scale" values="1 0.4;1 1;1 0.4" dur="1.8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(0 548)">
      <rect x="380" y="-75" width="20" height="75" rx="6" fill="url(#barGrad)">
        <animateTransform attributeName="transform" type="scale" values="1 0.4;1 1;1 0.4" dur="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(0 548)">
      <rect x="412" y="-120" width="20" height="120" rx="6" fill="url(#barGrad)">
        <animateTransform attributeName="transform" type="scale" values="1 0.4;1 1;1 0.4" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(0 548)">
      <rect x="444" y="-85" width="20" height="85" rx="6" fill="url(#barGrad)">
        <animateTransform attributeName="transform" type="scale" values="1 0.4;1 1;1 0.4" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(0 548)">
      <rect x="476" y="-110" width="20" height="110" rx="6" fill="url(#barGrad)">
        <animateTransform attributeName="transform" type="scale" values="1 0.4;1 1;1 0.4" dur="1.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(0 548)">
      <rect x="508" y="-70" width="20" height="70" rx="6" fill="url(#barGrad)">
        <animateTransform attributeName="transform" type="scale" values="1 0.4;1 1;1 0.4" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- CARD B: PROJECT (top right) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 24" to="0 0" begin="0.4s" dur="0.8s" fill="freeze"/>
    <rect x="580" y="260" width="380" height="155" rx="36" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
    <rect x="580" y="260" width="380" height="155" rx="36" fill="none" stroke="#bf5af2" stroke-width="2" pathLength="100" stroke-dasharray="12 88" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="608" y="292" font-size="12" font-weight="600" letter-spacing="2" fill="#0a84ff">PROJECT</text>
    <text x="608" y="336" font-size="28" font-weight="700" letter-spacing="-0.5" fill="#f5f5f7">Dodge Game</text>
    <text x="608" y="366" font-size="15" fill="#86868b">A dodging game</text>

    <circle cx="832" cy="280" r="5" fill="#0a84ff">
      <animate attributeName="cy" values="280;400" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="868" cy="280" r="5" fill="#bf5af2">
      <animate attributeName="cy" values="280;400" dur="2.3s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2.3s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="904" cy="280" r="5" fill="#ff375f">
      <animate attributeName="cy" values="280;400" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="868" cy="384" r="8" fill="#ffffff">
      <animate attributeName="cx" values="832;904;832" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- CARD C: DUET (middle right) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 24" to="0 0" begin="0.6s" dur="0.8s" fill="freeze"/>
    <rect x="580" y="435" width="380" height="155" rx="36" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
    <rect x="580" y="435" width="380" height="155" rx="36" fill="none" stroke="#30d158" stroke-width="2" pathLength="100" stroke-dasharray="12 88" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="608" y="467" font-size="12" font-weight="600" letter-spacing="2" fill="#30d158">CONTRIBUTION</text>
    <text x="608" y="511" font-size="28" font-weight="700" letter-spacing="-0.5" fill="#f5f5f7">DUET</text>
    <text x="608" y="541" font-size="15" fill="#86868b">Data pipeline &amp; steering component</text>
    <circle cx="936" cy="467" r="5" fill="#30d158"/>
    <circle cx="936" cy="467" r="5" fill="none" stroke="#30d158" stroke-width="2">
      <animate attributeName="r" values="5;14" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- CARD D: CONTRIBUTION (full-width bottom) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 24" to="0 0" begin="0.8s" dur="0.8s" fill="freeze"/>
    <rect x="40" y="620" width="920" height="150" rx="36" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
    <rect x="40" y="620" width="920" height="150" rx="36" fill="none" stroke="#30d158" stroke-width="2" pathLength="100" stroke-dasharray="12 88" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="72" y="656" font-size="12" font-weight="600" letter-spacing="2" fill="#30d158">CONTRIBUTION</text>
    <text x="72" y="702" font-size="34" font-weight="700" letter-spacing="-0.5" fill="#f5f5f7">Quoridor</text>
    <text x="72" y="734" font-size="16" fill="#86868b">Contributor to the board game</text>

    <circle cx="700" cy="652" r="3" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="740" cy="652" r="3" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="780" cy="652" r="3" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="820" cy="652" r="3" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="860" cy="652" r="3" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="700" cy="690" r="3" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="740" cy="690" r="3" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="780" cy="690" r="3" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="820" cy="690" r="3" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="860" cy="690" r="3" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="700" cy="728" r="3" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="740" cy="728" r="3" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="780" cy="728" r="3" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="820" cy="728" r="3" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="860" cy="728" r="3" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="700" cy="652" r="7" fill="#30d158">
      <animate attributeName="cx" values="700;780;780;860;860;700" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="652;652;690;690;728;728" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Light sheen sweeping across the whole profile -->
  <rect x="-400" y="0" width="400" height="800" fill="url(#sheen)">
    <animate attributeName="x" values="-400;1000" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
