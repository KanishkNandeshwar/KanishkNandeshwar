<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="76" viewBox="0 0 1100 76" role="img" aria-labelledby="title desc">
  <title id="title">Projects terminal status</title>
  <desc id="desc">A dark terminal strip with a softly pulsing champagne status light and blinking cursor.</desc>
  <rect x="1" y="1" width="1098" height="74" rx="12" fill="#101318" stroke="#2a2f38" stroke-width="2"/>
  <circle cx="29" cy="38" r="6" fill="#d4af6a">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="52" y="44" fill="#8a8f99" font-family="Consolas, 'Courier New', monospace" font-size="16">kanishk.projects</text>
  <text x="246" y="44" fill="#d4af6a" font-family="Consolas, 'Courier New', monospace" font-size="16">$</text>
  <text x="265" y="44" fill="#eceef2" font-family="Consolas, 'Courier New', monospace" font-size="16">explore --selected</text>
  <rect x="436" y="29" width="9" height="20" rx="1" fill="#d4af6a">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.48;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="1070" y="44" text-anchor="end" fill="#626a78" font-family="Consolas, 'Courier New', monospace" font-size="13">4 repositories</text>
</svg>
